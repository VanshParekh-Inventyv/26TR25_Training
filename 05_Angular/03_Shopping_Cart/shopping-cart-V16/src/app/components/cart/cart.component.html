<mat-card *ngIf="cart.length; else emptyCart">
  <mat-list>
    <mat-list-item *ngFor="let item of cart">
      <div class="cart-item">
        <span class="name">
          {{ item.product.name }}
        </span>

        <div class="quantity-controls">
          <button
            mat-mini-fab
            color="primary"
            [disabled]="item.count === 1"
            (click)="decrement(item.product.id)"
          >
            −
          </button>

          <span class="quantity">
            {{ item.count }}
          </span>

          <button
            mat-mini-fab
            color="primary"
            (click)="increment(item.product.id)"
          >
            +
          </button>
        </div>

        <span class="price"> ₹{{ item.product.price * item.count }} </span>

        <button mat-icon-button color="warn" (click)="remove(item.product.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </mat-list-item>
  </mat-list>

  <mat-divider></mat-divider>

  <div class="cart-footer">
    <h3>Total: ₹{{ total }}</h3>

    <button mat-raised-button color="warn" (click)="clearCart()">
      Clear Cart
    </button>
  </div>
</mat-card>

<ng-template #emptyCart>
  <p class="empty">Your cart is empty.</p>
</ng-template>
